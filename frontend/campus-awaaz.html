<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111a2e">
<title>Campus Awaaz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111a2e'/%3E%3Cpath d='M7 18v-4M11.5 21V11M16 24V8M20.5 21V11M25 18v-4' stroke='%23f2a516' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Campus Awaaz — ink navy + marigold + peacock teal. Fonts: Bricolage Grotesque (headings) + Hind (body, has Devanagari). */
:root{--bg:#f2f4f7;--cd:#fff;--cd2:#f7f8fa;--tx:#121a2e;--mu:#5b6880;--bd:#dfe4ec;--ac:#0b6f73;--ac2:#e3f2f2;--gd:#f2a516;--ink:#111a2e;--ink2:#1b2742;--ok:#17855a;--er:#d03b3b;--sh:0 1px 2px rgba(17,26,46,.06),0 6px 20px rgba(17,26,46,.05);--btn:#111a2e;--btnt:#fff;--r:14px;--rail:236px;--hf:"Bricolage Grotesque","Hind",system-ui,sans-serif;--bf:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--cd:#131c31;--cd2:#18233c;--tx:#e9eefb;--mu:#98a5c3;--bd:#24304f;--ac:#4fd1c5;--ac2:#10302f;--ink:#0a0f1d;--ink2:#131c31;--btn:#4fd1c5;--btnt:#042a29;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="light"]{--btn:#111a2e;--btnt:#fff}
:root[data-theme="dark"]{--bg:#0b1120;--cd:#131c31;--cd2:#18233c;--tx:#e9eefb;--mu:#98a5c3;--bd:#24304f;--ac:#4fd1c5;--ac2:#10302f;--ink:#0a0f1d;--ink2:#131c31;--btn:#4fd1c5;--btnt:#042a29;--sh:0 1px 2px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15.5px/1.55 "Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--hf);letter-spacing:-.01em;margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mu{color:var(--mu)}

/* ---------- app shell: rail (desktop) / bottom bar (mobile) ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--ink);color:#d6def0;display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font:700 19px var(--hf);color:#fff}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink2);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.1)}
.mark svg{width:20px;height:20px}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:none;border:0;color:#b8c4de;cursor:pointer;text-align:left;font-weight:500;position:relative;width:100%}
.nv svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.nv.on{background:rgba(242,165,22,.14);color:#fff}
.nv.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--gd)}
.nv.on svg{color:var(--gd)}
.nv sup{margin-left:auto;background:var(--gd);color:#1b1300;border-radius:99px;padding:0 7px;font:700 11px/18px var(--bf);min-width:18px;text-align:center}
.nv sup:empty{display:none}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px;padding:0 6px}
.av{width:38px;height:38px;border-radius:50%;background:var(--gd);color:#1b1300;display:grid;place-items:center;font:700 16px var(--hf);flex:none}
.who b{display:block;color:#fff;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.who small{color:#93a3c6;font-size:12px}
.mini{display:flex;gap:8px}
.gh{flex:1;background:none;border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#cdd6ec;cursor:pointer;padding:7px 10px;font-size:13px}
.gh:hover{background:rgba(255,255,255,.07)}
.main{min-width:0;padding:clamp(14px,2.4vw,30px);max-width:1240px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:clamp(24px,3.2vw,34px);line-height:1.15}
.top p{margin:4px 0 0;color:var(--mu)}
.clk{display:flex;align-items:center;gap:9px;background:var(--cd);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-size:13.5px;white-space:nowrap}
.clk b{font:700 15px var(--hf);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(23,133,90,.5);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 7px rgba(23,133,90,0)}100%{box-shadow:0 0 0 0 rgba(23,133,90,0)}}

/* ---------- layout + cards ---------- */
.g{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:18px;min-width:0}
.cd>h3,.hd3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font:500 12px var(--bf);color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;white-space:nowrap}
.wide{max-width:860px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;padding:0;overflow:hidden}
.chh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.chh h3{font-size:16px;display:flex;align-items:center;gap:10px}
.live{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.tools{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu)}
.tools select{background:var(--cd2);border:1px solid var(--bd);border-radius:8px;padding:3px 6px}
.tg{white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.tg input{accent-color:var(--ac)}
#log{display:flex;flex-direction:column;gap:14px;height:min(56vh,520px);min-height:320px;overflow-y:auto;padding:18px;scroll-behavior:smooth}
.mw{display:flex;gap:10px;max-width:92%}.mw.u{align-self:flex-end;flex-direction:row-reverse}
.bav{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center;flex:none;margin-top:2px}.bav svg{width:17px;height:17px}
.m{padding:10px 14px;border-radius:14px;word-break:break-word;min-width:0}
.m p{margin:0}.m p+p,.m p+ul,.m ul+p{margin-top:8px}
.m ul{margin:0;padding-left:18px}.m li+li{margin-top:4px}
.m.b{background:var(--cd2);border:1px solid var(--bd);border-top-left-radius:4px}
.m.u{background:var(--btn);color:var(--btnt);border-top-right-radius:4px}
.mf{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12px;color:var(--mu)}
.mf button{background:none;border:0;color:var(--ac);cursor:pointer;padding:0;font-size:12px;font-weight:600}
.typing{display:flex;gap:4px;padding:6px 2px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:ty 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chs{display:flex;gap:8px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}
.ch{white-space:nowrap;background:var(--cd);border:1px solid var(--bd);border-radius:99px;padding:6px 13px;font-size:13.5px;cursor:pointer;color:var(--tx)}
.ch:hover{border-color:var(--ac);color:var(--ac)}
.cmp{display:flex;gap:10px;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--bd);position:relative}
.cmp input{flex:1;min-width:0;background:var(--cd2);border:1px solid var(--bd);border-radius:99px;padding:12px 18px;outline:none}
.cmp input:focus{border-color:var(--ac);background:var(--cd)}
.lsn{display:none;flex:1;align-items:center;gap:12px;font-weight:600;color:var(--tx)}
.cmp.lis .lsn{display:flex}.cmp.lis input,.cmp.lis #sb{display:none}
.wv{display:flex;gap:3px;align-items:center;height:28px}.wv i{width:4px;border-radius:3px;background:var(--gd);animation:wv 900ms ease-in-out infinite}
.wv i:nth-child(1){height:10px}.wv i:nth-child(2){height:22px;animation-delay:.1s}.wv i:nth-child(3){height:16px;animation-delay:.2s}.wv i:nth-child(4){height:26px;animation-delay:.3s}.wv i:nth-child(5){height:14px;animation-delay:.4s}.wv i:nth-child(6){height:22px;animation-delay:.5s}.wv i:nth-child(7){height:10px;animation-delay:.6s}
@keyframes wv{50%{transform:scaleY(.35)}}
.mc{flex:none;width:50px;height:50px;border-radius:50%;border:0;cursor:pointer;background:var(--gd);display:grid;place-items:center;transition:transform .15s}
.mc:hover{transform:scale(1.06)}.mc svg{width:23px;height:23px;fill:#1b1300}
.mc.on{animation:ring 1.2s infinite;background:var(--er)}.mc.on svg{fill:#fff}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(208,59,59,.5)}100%{box-shadow:0 0 0 18px rgba(208,59,59,0)}}
.bt{background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;white-space:nowrap}
.bt:hover{filter:brightness(1.15)}.bt:disabled{opacity:.5;cursor:default}
.bt.sec{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.bt.sm{padding:6px 12px;font-size:13px}.bt.full{width:100%;padding:12px}

/* ---------- today: now card + timeline ---------- */
.now{background:var(--ink);color:#fff;border:0;position:relative;overflow:hidden}
.now::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:22px solid rgba(242,165,22,.12)}
.now small{color:#a9b7d6;font-size:13px}
.now h2{font-size:22px;line-height:1.2;margin:6px 0 4px;max-width:90%}
.now p{margin:0;color:#c9d4ec;font-size:14px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gd);border-radius:9px;transition:width .6s}
.tag{display:inline-block;font:600 12px var(--bf);padding:2px 9px;border-radius:99px;background:var(--gd);color:#1b1300}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:70px 14px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl li:last-child{padding-bottom:0}
.tl time{font-size:12.5px;color:var(--mu);text-align:right;padding-top:2px;line-height:1.3}
.tl .pt{width:12px;height:12px;border-radius:50%;border:2px solid var(--bd);background:var(--cd);margin-top:5px;position:relative;z-index:1}
.tl li::before{content:"";position:absolute;left:79px;top:18px;bottom:-4px;width:2px;background:var(--bd)}.tl li:last-child::before{display:none}
.tl .on .pt{background:var(--gd);border-color:var(--gd);box-shadow:0 0 0 4px rgba(242,165,22,.25)}
.tl .dn{opacity:.55}
.tl b{display:block;line-height:1.3}.tl span{font-size:13px;color:var(--mu)}.tl span.tag{color:#1b1300;font-size:12px;margin-left:4px}
.cds{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cdn{padding:14px}.cdn .n{font:700 30px/1 var(--hf)}.cdn .n small{font:500 13px var(--bf);color:var(--mu);margin-left:4px}
.cdn p{margin:6px 0 0;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdn h4{margin:0 0 6px;font:600 13px var(--bf);color:var(--ac)}

/* ---------- lists ---------- */
.it{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--cd)}
.it:last-child{margin-bottom:0}
.it p{margin:3px 0 0;color:var(--mu);font-size:14px}.it small{color:var(--mu)}
.it.nw{border-left:4px solid var(--gd)}
.row2{display:flex;gap:14px;align-items:flex-start}
.date{flex:none;width:54px;text-align:center;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--cd2)}
.date b{display:block;font:700 20px/1.2 var(--hf);padding-top:4px}.date span{display:block;font-size:11px;color:var(--mu);padding-bottom:4px}
.chip{display:inline-block;font:600 12px var(--bf);padding:1px 9px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.chip.w{background:rgba(242,165,22,.18);color:#8a5a00}.chip.g{background:rgba(23,133,90,.14);color:var(--ok)}
:root[data-theme="dark"] .chip.w{color:var(--gd)}
.ft{display:inline-block;font:700 11px var(--bf);letter-spacing:.04em;border-radius:6px;padding:2px 7px;background:var(--ink);color:#fff;margin-right:8px}
.lk{background:none;border:0;color:var(--ac);cursor:pointer;font-size:13.5px;font-weight:600;padding:0;margin-right:14px;text-decoration:none}.lk:hover{text-decoration:underline}.lk.dg{color:var(--er)}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}.empty b{display:block;color:var(--tx);font:600 17px var(--hf);margin-bottom:4px}
.sk{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--cd2),var(--bd),var(--cd2));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}@keyframes sk{to{background-position:-200% 0}}

/* ---------- forms ---------- */
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:12px}
label input,label select,label textarea,textarea.fl,.fx input.grow,.sch{display:block;width:100%;margin-top:5px;background:var(--cd2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;outline:none;color:var(--tx);font-weight:400}
textarea{width:100%;background:var(--cd2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;min-height:76px;outline:none;resize:vertical}
label input:focus,label select:focus,textarea:focus,.sch:focus{border-color:var(--ac);background:var(--cd)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fx{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.fx .grow{flex:1;min-width:180px;margin:0}
.er{color:var(--er);font-size:14px;min-height:20px;margin:2px 0 8px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-10%);background:none;border:0;color:var(--mu);cursor:pointer;font-size:13px;font-weight:600}

/* ---------- stats (admin) ---------- */
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stc{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stc b{display:block;font:700 30px/1.1 var(--hf)}.stc span{font-size:13px;color:var(--mu)}.stc.hot b{color:var(--er)}

/* ---------- auth ---------- */
.au{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.hero{background:var(--ink);color:#fff;padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;border:56px solid rgba(242,165,22,.08)}
.hero .brand{padding:0;font-size:20px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.05;max-width:12ch}
.hero h1 em{font-style:normal;color:var(--gd)}
.hero>p{color:#bcc9e4;max-width:44ch;margin:0;font-size:17px}
.demo{display:flex;flex-direction:column;gap:8px;max-width:420px}
.demo .m{font-size:14.5px}.demo .m.b{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#e9eefb}
.demo .m.u{background:var(--gd);color:#1b1300;align-self:flex-end}
.fts{display:flex;flex-wrap:wrap;gap:8px}.fts span{border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:4px 13px;font-size:13.5px;color:#d6def0}
.fw{display:grid;place-items:center;padding:clamp(18px,4vw,48px)}
.lc{width:min(440px,100%);padding:26px}
.lc h3{font-size:22px;margin-bottom:14px}
.rl{display:flex;background:var(--cd2);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:18px}
.rl button,.tb button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mu)}
.rl button.on{background:var(--cd);color:var(--ac);box-shadow:var(--sh)}
.sw{font-size:14px;color:var(--mu);text-align:center;margin:14px 0 0}.sw a{color:var(--ac);cursor:pointer;font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:14px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}

/* ---------- toast + popup ---------- */
.ts{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;max-width:90vw;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14.5px;border-left:4px solid var(--gd)}
.ts.bad{border-left-color:var(--er)}
@media(min-width:861px){.ts{bottom:26px}}
#popups{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;pointer-events:none}
.pop{pointer-events:auto;display:flex;align-items:stretch;width:min(520px,100%);background:var(--ink);color:#fff;border-left:5px solid var(--gd);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.35);transform:translateY(-140%);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.pop.show{transform:none;opacity:1}
.pop .pb{flex:1;text-align:left;background:none;border:0;color:inherit;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.pop .pb span{font-size:13.5px;color:#c3cee6}
.pop .px{background:none;border:0;color:#9fb0d0;cursor:pointer;padding:0 14px;font-size:16px}

/* ---------- mobile ---------- */
@media(max-width:860px){
 .shell{grid-template-columns:1fr;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
 .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:50;gap:0;border-top:1px solid rgba(255,255,255,.1);overflow-x:auto}
 .rail .brand,.rail .me{display:none}
 .nav{flex-direction:row;gap:2px;flex:1;min-width:max-content}
 .nv{flex-direction:column;gap:2px;padding:6px 10px;font-size:11.5px;text-align:center;min-width:64px;width:auto;flex:1}
 .nv.on::before{left:22%;right:22%;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 4px 4px}
 .nv sup{position:absolute;top:2px;right:10px;margin:0}
 .mtop{display:flex!important}
 .g,.au{grid-template-columns:1fr}
 .hero{padding:28px 20px;gap:18px}.hero h1{max-width:none}.demo,.hero .fts{display:none}
 .main{padding:14px}
 #log{height:calc(100dvh - 440px);min-height:220px}
 .clk,.top p{display:none}.top{margin-bottom:12px}.chh{padding:10px 14px}.chs{padding:0 14px 10px}.cmp{padding:10px 14px 12px}
 .cds{grid-template-columns:1fr 1fr}
 .tl li{grid-template-columns:62px 14px 1fr}.tl li::before{left:71px}
}

<body>
<div id="popups" aria-live="polite"></div>
<div id="app"></div>
<script type="module">
/* ===== config ===== */
// Where the backend lives.
//  ''  = same server (backend serves this folder)  -> default
//  'https://your-backend.onrender.com' = frontend hosted separately (set CORS_ORIGINS in backend/.env)
const API_BASE = '';

/* ===== core/state ===== */
// Single shared state object for the whole UI.
const ls = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const S = {
  token: ls('tk'),
  me: null,            // {name,email,role,section}
  view: 'chat',
  chat: [],            // assistant conversation
  notes: [], seen: 0, lastId: null, timer: null,
  secs: [],            // sections list for signup
  authRole: 'student', authMode: 'in', form: {},
  today: null,         // /today payload, used by the "Now" card
};

/* ===== core/utils ===== */
const $ = s => document.querySelector(s);
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IST = { timeZone: 'Asia/Kolkata' };
const fdate = s => new Date(s + 'T00:00:00+05:30').toLocaleDateString('en-IN', { ...IST, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const ftime = ts => new Date(ts * 1000).toLocaleString('en-IN', { ...IST, day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const firstName = n => (n || '').replace(/^(dr|mr|ms|mrs|prof)\.?\s+/i, '').split(' ')[0];
const hm = d => d.toLocaleTimeString('en-IN', { ...IST, hour: 'numeric', minute: '2-digit', hour12: true }).toUpperCase();

function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago'; if (s < 604800) return Math.floor(s / 86400) + ' d ago';
  return ftime(ts);
}
function greeting() {
  const h = Number(new Date().toLocaleString('en-IN', { ...IST, hour: 'numeric', hour12: false }));
  return h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}
// assistant text -> safe HTML: "•" lines become a list, other lines become paragraphs
function rich(t) {
  const out = []; let list = [];
  const flush = () => { if (list.length) { out.push('<ul>' + list.map(x => `<li>${x}</li>`).join('') + '</ul>'); list = []; } };
  String(t).split('\n').forEach(l => {
    const m = l.match(/^\s*[•\-]\s+(.*)/);
    if (m) list.push(E(m[1])); else if (/^\s{2,}\S/.test(l) && list.length) list[list.length - 1] += '<br><small class="mu">' + E(l.trim()) + '</small>'; else if (l.trim()) { flush(); out.push(`<p>${E(l)}</p>`); }
  });
  flush(); return out.join('');
}

function toast(m, bad) {
  const d = document.createElement('div'); d.className = 'ts' + (bad ? ' bad' : ''); d.setAttribute('role', 'status'); d.textContent = m;
  document.body.appendChild(d); setTimeout(() => d.remove(), bad ? 6000 : 3800);
}

function badge() {                         // unread count on the Notifications tab
  const c = S.notes.filter(n => n.ts > S.seen).length;
  document.querySelectorAll('#nb').forEach(e => { e.textContent = c || ''; });
}

const empty = (title, hint = '') => `<div class="empty"><b>${E(title)}</b>${E(hint)}</div>`;
const skeleton = (n = 3) => '<div class="cd wide">' + '<div class="sk"></div>'.repeat(n) + '</div>';

/* ===== core/actions ===== */
// Tiny event-delegation layer: HTML uses data-a="name" (click), data-change="name", data-enter="name".
const reg = {};
const action = (name, fn) => { reg[name] = fn; };
const call = (name, el, ev) => { const f = reg[name]; if (f) Promise.resolve(f({ ...el.dataset }, el, ev)).catch(e => console.error(e)); };

document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el) call(el.dataset.a, el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el) call(el.dataset.change, el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) call(e.target.dataset.enter, e.target, e); });

/* ===== core/api ===== */
const apiUrl = p => API_BASE + '/api' + p;

// FastAPI sends 422 errors as a list of objects - turn any shape into a readable sentence.
const msg = d => Array.isArray(d) ? d.map(x => (x.loc ? String(x.loc[x.loc.length - 1]) + ': ' : '') + (x.msg || '')).join('; ')
  : typeof d === 'string' ? d : 'Something went wrong. Please try again.';

async function api(p, o = {}) {
  let body = o.body; const h = { 'X-Token': S.token };
  if (body && !(body instanceof FormData)) { h['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  let r;
  try { r = await fetch(apiUrl(p), { method: o.method || (body ? 'POST' : 'GET'), headers: h, body }); }
  catch (e) { throw Error('Cannot reach the server. Check your connection and try again.'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && S.me) { window.dispatchEvent(new Event('session-expired')); throw Error('Session expired, please login again'); }
  if (!r.ok) throw Error(msg(j.detail));
  return j;
}

/* ===== core/router ===== */
const pages = {};
const registerPages = p => Object.assign(pages, p);

function go(v, quiet) {
  S.view = v;
  document.querySelectorAll('.nv').forEach(b => { const on = b.dataset.arg === v; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (!quiet && v !== 'chat') pg(skeleton());
  window.scrollTo(0, 0);
  Promise.resolve(pages[v]()).catch(e => { pg(`<div class="cd wide"><div class="empty"><b>Could not load this page</b>${e.message}</div></div>`); toast(e.message, true); });
  badge();
}

const pg = h => { const p = $('#pg'); if (p) p.innerHTML = h; };
const box = h => pg(`<div class="cd wide">${h}</div>`);

// run an API call, show a toast, refresh the current page. Ignores clicks while a call is running (no double submits).
let busy = false;
const act = async (f, ok) => {
  if (busy) return; busy = true;
  try { await f(); if (ok) toast(ok); go(S.view, true); } catch (e) { toast(e.message, true); } finally { busy = false; }
};

/* ===== services/sound ===== */
// Notification "pop" sound, synthesised in the browser (no audio file needed).
let ac;
const ctx = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());
const unlockAudio = () => { try { ctx().resume(); } catch (e) { /* ignore */ } };
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));

function popSound() {
  try {
    const c = ctx(); c.resume(); const t = c.currentTime;
    [[520, 980, 0], [780, 1250, 0.14]].forEach(([f0, f1, d]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f0, t + d); o.frequency.exponentialRampToValueAtTime(f1, t + d + 0.08);
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
      o.connect(g); g.connect(c.destination); o.start(t + d); o.stop(t + d + 0.22);
    });
  } catch (e) { /* ignore */ }
}

/* ===== services/popup ===== */
// Banner that drops in at the top of the dashboard for a few seconds, with a pop sound.


function showPopup(title, body, ms = 6000) {
  const d = document.createElement('div');
  d.className = 'pop'; d.setAttribute('role', 'alert');
  d.innerHTML = `<button class="pb" data-a="go" data-arg="nt"><b>${E(title)}</b><span>${E(body)}</span></button><button class="px" data-a="closePop" aria-label="Close">x</button>`;
  $('#popups').appendChild(d);
  requestAnimationFrame(() => d.classList.add('show'));
  popSound();
  setTimeout(() => { d.classList.remove('show'); setTimeout(() => d.remove(), 400); }, ms);
}

/* ===== services/notifier ===== */
// Polls the backend for new notifications -> badge, popup + pop sound.





async function poll() {
  if (!S.me || S.me.role === 'admin') return;
  try {
    const r = await api('/notes'); S.notes = r.items; S.seen = r.seen;
    const top = S.notes.length ? S.notes[0].id : 0;
    if (S.lastId === null) {                                   // first load after login
      const unread = S.notes.filter(n => n.ts > S.seen).length;
      if (unread) showPopup('Notifications', `You have ${unread} unread notification${unread > 1 ? 's' : ''}`);
    } else if (top > S.lastId) {                               // new ones arrived while the dashboard is open
      S.notes.filter(n => n.id > S.lastId).reverse().slice(-3).forEach((n, i) => setTimeout(() => showPopup(n.title, n.body), i * 800));
      if (S.view === 'nt') go('nt');
    }
    S.lastId = top; badge();
  } catch (e) { /* offline: try again next tick */ }
}

function startPolling() { stopPolling(); S.lastId = null; poll(); S.timer = setInterval(poll, 5000); }
function stopPolling() { clearInterval(S.timer); S.timer = null; }

/* ===== services/voice ===== */
// Voice: ElevenLabs (via backend) for speaking + listening, browser voice as fallback.



const V = { elevenlabs: false, voices: [1, 2, 3, 4].map(i => ({ id: String(i), name: `Assistant ${i}` })) };
const voiceList = () => V.voices;
const getVoice = () => localStorage.voice || '1';
const setVoice = id => { localStorage.voice = id; };

async function loadVoiceConfig() {
  try { const c = await api('/voice/config'); V.elevenlabs = c.elevenlabs; V.voices = c.voices; } catch (e) { /* keep defaults */ }
}

const FULL = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday', Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', Jun: 'June', Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };
const speechText = x => x.replace(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g, m => FULL[m]).replace(/→/g, ' to ').replace(/[•]/g, '').replace(/\n+/g, '. ');

/* ---------- speaking ---------- */
let audio = null;
function stopSpeaking() { if (audio) { audio.pause(); audio = null; } if (window.speechSynthesis) speechSynthesis.cancel(); }

async function speak(text, lang = 0) {                 // lang: 0 English, 1 Hinglish, 2 Hindi (answer language)
  stopSpeaking(); text = speechText(text);
  if (V.elevenlabs) {
    try {
      const r = await fetch(apiUrl('/voice/tts'), { method: 'POST', headers: { 'X-Token': S.token, 'Content-Type': 'application/json' }, body: JSON.stringify({ text, voice: getVoice(), lang }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw Error(j.detail || 'voice failed'); }
      const url = URL.createObjectURL(await r.blob()); audio = new Audio(url);
      audio.onended = () => URL.revokeObjectURL(url); await audio.play(); return;
    } catch (e) { toast('ElevenLabs: ' + e.message + ' (using browser voice)'); }
  }
  browserSpeak(text, lang);
}

function browserSpeak(text, lang) {
  if (!window.speechSynthesis) return;
  const all = speechSynthesis.getVoices(), pool = all.filter(v => v.lang.toLowerCase().startsWith(lang ? 'hi' : 'en')), list = pool.length ? pool : all;
  const v = list.length ? list[(Number(getVoice()) - 1) % list.length] : null, u = new SpeechSynthesisUtterance(text);
  u.lang = v ? v.lang : (lang ? 'hi-IN' : 'en-IN'); if (v) u.voice = v; u.rate = 0.95; speechSynthesis.speak(u);
}

/* ---------- listening ---------- */
// Which language the person speaks: 'auto' | 'en' | 'hi'. Telling the recogniser the language is the biggest accuracy win.
const getVLang = () => { try { return localStorage.ca_vlang || 'auto'; } catch (e) { return 'auto'; } };
const setVLang = v => { try { localStorage.ca_vlang = v; } catch (e) { /* ignore */ } };

let rec = null, stopTimer = null, vad = null;
const mark = on => { const b = $('#mb'); if (b) b.classList.toggle('on', on); const c = $('#cmp'); if (c) c.classList.toggle('lis', on); };

// Stops the recording by itself ~1.6 s after the person stops talking (so no need to tap again, and no long silent tail).
function watchSilence(stream, stop) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), src = ac.createMediaStreamSource(stream), an = ac.createAnalyser();
    an.fftSize = 1024; src.connect(an); const buf = new Uint8Array(an.fftSize); let heard = false, quiet = 0, t0 = Date.now();
    const id = setInterval(() => {
      an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) sum += (v - 128) * (v - 128);
      const rms = Math.sqrt(sum / buf.length);
      if (rms > 9) { heard = true; quiet = 0; } else if (heard) quiet += 100;
      if (heard && quiet >= 1600) stop(); else if (!heard && Date.now() - t0 > 7000) stop();       // nobody spoke
    }, 100);
    vad = () => { clearInterval(id); try { ac.close(); } catch (e) { /* ignore */ } };
  } catch (e) { vad = null; }
}

async function toggleMic(onText) {
  if (rec) { rec.stop(); return; }                                // second tap = stop & send
  if (!V.elevenlabs || !window.MediaRecorder) return browserMic(onText);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } }); }
  catch (e) { return toast('Microphone blocked. Click the lock icon in the address bar and allow the microphone.', true); }
  const chunks = [], mt = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const r = new MediaRecorder(stream, mt ? { mimeType: mt, audioBitsPerSecond: 128000 } : {}); rec = r;
  r.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  r.onstart = () => { mark(true); watchSilence(stream, () => rec && rec.state === 'recording' && rec.stop()); };
  r.onstop = async () => {
    clearTimeout(stopTimer); if (vad) vad(); vad = null; stream.getTracks().forEach(t => t.stop()); mark(false); rec = null;
    const type = r.mimeType || 'audio/webm', blob = new Blob(chunks, { type });
    if (blob.size < 2500) return toast('I did not hear anything. Tap the mic and speak a little closer.', true);
    const fd = new FormData(); fd.append('file', blob, 'speech.' + (type.includes('mp4') ? 'mp4' : 'webm'));
    const l = getVLang();
    try { const j = await api('/voice/stt' + (l !== 'auto' ? '?language=' + l : ''), { body: fd }); if (j.text) onText(j.text); else toast('I could not make that out. Please try again.', true); }
    catch (e) { toast(e.message, true); }
  };
  r.start(250); stopTimer = setTimeout(() => rec && rec.state === 'recording' && rec.stop(), 20000);
}

function browserMic(onText) {                                    // fallback when ElevenLabs is not configured
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Voice input needs ElevenLabs (backend) or Chrome / Edge.', true);
  const l = getVLang(), r = new SR(); r.lang = l === 'hi' ? 'hi-IN' : 'en-IN'; r.interimResults = false; r.maxAlternatives = 1;
  r.onstart = () => mark(true); r.onend = () => mark(false);
  r.onerror = e => toast(e.error === 'no-speech' ? 'I did not hear anything, please try again.' : 'Mic error: ' + e.error, true);
  r.onresult = e => onText(e.results[0][0].transcript); r.start();
}

/* ===== pages/documents ===== */
const dRow = (x, adm) => {
  const u = `/api/docs/${x.id}/file?t=${encodeURIComponent(S.token)}`, v = ['pdf', 'jpg', 'jpeg'].includes(x.ext);
  return `<div class="it ${adm && !x.pub ? 'nw' : ''}" data-t="${E(x.title.toLowerCase())}"><span class="ft">${E(x.ext.toUpperCase())}</span><b>${E(x.title)}</b>
<p>${x.cat === 'notice' ? ftime(x.ts) : 'Official document'}${adm ? (x.pub ? ' · Published' : ' · Draft, not visible to students') : ''}</p>
<div style="margin-top:6px">${v ? `<a class="lk" target="_blank" rel="noopener" href="${u}">View</a>` : ''}<a class="lk" href="${u}&dl=1">Download</a>
${adm ? `${x.pub ? '' : `<button class="lk" data-a="publishDoc" data-id="${x.id}">Publish</button>`}<button class="lk dg" data-a="deleteDoc" data-id="${x.id}">Delete</button>` : ''}</div></div>`;
};

async function pDc() {
  const d = await api('/docs'), a = S.me.role === 'admin', off = d.filter(x => x.cat !== 'notice'), nt = d.filter(x => x.cat === 'notice');
  box(`<h3>Documents <span class="pill">${d.length} files</span></h3><input class="sch" id="ds" placeholder="Search documents…" aria-label="Search documents" style="margin-bottom:14px">`
    + (nt.length ? '<h4 class="hd3 mu">Notices</h4>' + nt.map(x => dRow(x, a)).join('') : '') + (off.length ? '<h4 class="hd3 mu" style="margin-top:16px">Official</h4>' + off.map(x => dRow(x, a)).join('') : '') + (d.length ? '' : empty('No documents yet', 'Timetables, syllabus and notices will show here.')));
}

document.addEventListener('input', e => { if (e.target.id === 'ds') { const q = e.target.value.toLowerCase(); document.querySelectorAll('#pg .it[data-t]').forEach(r => { r.style.display = r.dataset.t.includes(q) ? '' : 'none'; }); } });
action('publishDoc', d => act(() => api(`/admin/docs/${d.id}/publish`, { method: 'POST' }), 'Published. Students were notified.'));
action('deleteDoc', d => confirm('Delete this document for everyone?') && act(() => api(`/admin/docs/${d.id}`, { method: 'DELETE' }), 'Deleted'));

/* ===== pages/events ===== */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const evCard = x => { const [y, m, d] = x.d.split('-'); return `<div class="it row2"><div class="date"><b>${Number(d)}</b><span>${MON[m - 1]}</span></div><div><b>${E(x.title)}</b> <span class="chip">${E(x.k)}</span>${x.tm ? `<p>${E(x.tm)}</p>` : ''}${x.x ? `<p>${E(x.x)}</p>` : ''}</div></div>`; };

async function pEv() {
  const [e, d] = await Promise.all([api('/events'), api('/docs')]), n = d.filter(x => x.cat === 'notice');
  box('<h3>Events</h3>' + (e.map(evCard).join('') || empty('Nothing scheduled', 'New events from the admin appear here.')) + '<h3 style="margin-top:22px">Notices</h3>' + (n.map(x => dRow(x)).join('') || empty('No notices', '')));
}

/* ===== pages/shell ===== */
const LOGO = '<svg viewBox="0 0 32 32" fill="none" stroke="#f2a516" stroke-width="2.8" stroke-linecap="round"><path d="M7 18v-4M11.5 21V11M16 24V8M20.5 21V11M25 18v-4"/></svg>';
const IC = {
  chat: 'M4 5h16v11H9l-5 4z', ev: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4', nt: 'M6 17v-6a6 6 0 0112 0v6l2 2H4zM10 21h4',
  cp: 'M5 3v18M5 4h12l-2 4 2 4H5', dc: 'M7 3h8l4 4v14H7zM14 3v5h5', ao: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  aq: 'M12 21a9 9 0 100-18 9 9 0 000 18zM9.5 9a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5M12 17h.01', ac: 'M5 3v18M5 4h12l-2 4 2 4H5',
  an: 'M3 11v2l12 5V6zM15 9a3 3 0 010 6', au: 'M12 16V4M7 9l5-5 5 5M4 20h16', ar: 'M7 7h13l-4-4M17 17H4l4 4',
};
const icon = k => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[k]}"/></svg>`;

// Tabs per role. Faculty: no events, documents or complaints.
const TABS = role => role === 'admin'
  ? [['ao', 'Overview'], ['aq', 'Queries'], ['ac', 'Complaints'], ['an', 'Announce'], ['au', 'Notices'], ['ar', 'Rooms'], ['dc', 'Documents']]
  : role === 'faculty'
    ? [['chat', 'Assistant'], ['nt', 'Notifications']]
    : [['chat', 'Assistant'], ['ev', 'Events'], ['nt', 'Notifications'], ['cp', 'Complaints'], ['dc', 'Documents']];

function shell() {
  const m = S.me, a = m.role === 'admin', init = (firstName(m.name)[0] || 'A').toUpperCase();
  const tools = '<div class="mini"><button class="gh" data-a="theme" aria-label="Switch light / dark theme">Theme</button><button class="gh" data-a="logout">Logout</button></div>';
  $('#app').innerHTML = `<div class="shell">
<aside class="rail"><div class="brand"><span class="mark">${LOGO}</span>Campus Awaaz</div>
<nav class="nav" aria-label="Main">${TABS(m.role).map(t => `<button class="nv" data-a="go" data-arg="${t[0]}">${icon(t[0])}<span>${E(t[1])}</span>${t[0] === 'nt' ? '<sup id="nb"></sup>' : ''}</button>`).join('')}</nav>
<div class="me"><div class="who"><span class="av">${E(init)}</span><div><b>${E(m.name)}</b><small>${E(a ? 'Administrator' : m.section || 'Faculty')}</small></div></div>${tools}</div></aside>
<div><div class="mtop"><div class="brand"><span class="mark">${LOGO}</span>Campus Awaaz</div>${tools}</div><main class="main" id="pg"></main></div></div>`;
  tick(); go(S.view);
}

function tick() {
  const d = new Date(), w = $('#dw'); if (!w) return;
  const IST = { timeZone: 'Asia/Kolkata' };
  w.textContent = d.toLocaleDateString('en-IN', { ...IST, weekday: 'short', day: 'numeric', month: 'short' });
  $('#tm').textContent = d.toLocaleTimeString('en-IN', { ...IST, hour12: true }).toUpperCase();
}

async function logout(callApi = true) {
  if (callApi) { try { await api('/logout', { method: 'POST' }); } catch (e) { /* ignore */ } }
  stopPolling(); stopSpeaking();
  S.token = ''; try { localStorage.removeItem('tk'); } catch (e) { /* ignore */ } S.me = null; S.notes = []; S.lastId = null; authView();
}

action('go', d => go(d.arg));
action('logout', () => logout());
action('closePop', (d, el) => el.parentElement.remove());
action('theme', () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;

function drawLog(typing) {
  const l = $('#log'); if (!l) return;
  const msg = (m, i) => m.w === 'u'
    ? `<div class="mw u"><div><div class="m u"><p>${E(m.t)}</p></div></div></div>`
    : `<div class="mw"><span class="bav">${LOGO}</span><div><div class="m b">${rich(m.t)}</div><div class="mf"><span>${hm(new Date(m.ts || Date.now()))}</span><button data-a="say" data-i="${i}">Listen</button><button data-a="copy" data-i="${i}">Copy</button></div></div></div>`;
  l.innerHTML = S.chat.map(msg).join('') + (typing ? `<div class="mw"><span class="bav">${LOGO}</span><div class="m b"><div class="typing"><i></i><i></i><i></i></div></div></div>` : '');
  l.scrollTop = l.scrollHeight;
  const c = $('#chs'); if (c) c.style.display = S.chat.length > 3 ? 'none' : '';     // chips are for getting started
}

let pending = false;
async function send(text) {
  const i = $('#qi'), x = (typeof text === 'string' ? text : i.value).trim(); if (!x || pending) return;
  pending = true; i.value = ''; S.chat.push({ w: 'u', t: x, ts: Date.now() }); drawLog(true);
  const sb = $('#sb'); if (sb) sb.disabled = true;
  try { const r = await api('/chat', { body: { t: x } }); S.chat.push({ w: 'b', t: r.a, lang: r.lang, ts: Date.now() }); drawLog(); speak(r.a, r.lang); }
  catch (e) { S.chat.push({ w: 'b', t: 'Sorry, that did not go through. ' + e.message, ts: Date.now() }); drawLog(); }
  finally { pending = false; if ($('#sb')) $('#sb').disabled = false; }
}

async function today() {
  const r = await api('/today'); S.today = r; const el = $('#tdc'); if (!el) return;
  const now = new Date(), nowIdx = Number(now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', hour12: false })) - 9;
  if (r.blocks === null) {
    el.innerHTML = '<h3>Today</h3>' + empty(r.faculty_unmatched ? 'Your name is not in the timetable' : 'Timetable not uploaded yet', r.faculty_unmatched ? 'Sign up with your name exactly as it appears in the timetable.' : 'Ask the assistant anything. Queries I cannot answer go to the admin.');
    $('#nowc').innerHTML = ''; return;
  }
  el.innerHTML = `<h3>Today <span class="pill">${r.day}</span></h3>` + (r.blocks.length ? '<ol class="tl">' + r.blocks.map(b => {
    const lib = b.s === 'Library';
    return `<li class="${b.on ? 'on' : b.end < nowIdx ? 'dn' : ''}"><time>${E(b.t.split(' - ')[0])}</time><i class="pt"></i><div><b>${E(b.s)} ${b.on ? '<span class="tag">Now</span>' : ''}</b>${lib ? '' : `<span>${E(b.f)}${b.f ? ' · ' : ''}${E(b.p)}${b.sec ? ' · ' + E(b.sec) : ''}</span>`}</div></li>`;
  }).join('') + '</ol>' : empty('No classes today', 'Enjoy the free day.'));
  // "Now" card: current class with progress, otherwise the next one
  const real = r.blocks.filter(b => b.s !== 'Library'), cur = real.find(b => b.on), nxt = real.find(b => b.i > nowIdx);
  const mins = (now.getMinutes()), pct = cur ? Math.min(100, Math.round(((nowIdx - cur.i) * 60 + mins) / ((cur.end - cur.i + 1) * 60) * 100)) : 0;
  const nc = $('#nowc'); if (!nc) return;
  const b = cur || nxt;
  nc.innerHTML = b ? `<div class="cd now"><small>${cur ? 'Happening now' : 'Up next at ' + E(b.t.split(' - ')[0])}</small><h2>${E(b.s)}</h2><p>${E(b.f)}${b.f ? ' · ' : ''}${E(b.p)}</p>${cur ? `<div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>` : ''}</div>`
    : `<div class="cd now"><small>Today</small><h2>You’re done for the day</h2><p>No more classes. Ask me about tomorrow.</p></div>`;
}

}

async function lookup() {                                   // pre-fill "engaged room" from the timetable
  const sec = $('#rs')?.value, dt = $('#rd')?.value, sl = $('#r0')?.value; if (!sec || !dt) { if ($('#rsub')) $('#rsub').textContent = ''; return; }
  try { const r = await api(`/admin/room-lookup?sec=${encodeURIComponent(sec)}&dt=${dt}&slot=${sl}`); $('#rf').value = r.room || ''; $('#rsub').textContent = r.subject ? '(' + r.subject + ')' : ''; } catch (e) { /* ignore */ }
}
document.addEventListener('change', e => { if (['rs', 'rd', 'r0'].includes(e.target.id)) lookup(); if (e.target.id === 'r0') { const u = $('#r1'), v = Number(e.target.value); if (u && Number(u.value) < v) u.value = v; } });

async function boot() {
  try { S.me = await api('/me'); } catch (e) { S.me = null; return authView(); }
  const admin = S.me.role === 'admin';
  S.view = admin ? 'ao' : 'chat';
  S.chat = [{ w: 'b', t: `Hi ${firstName(S.me.name)}! I’m Awaaz, your campus assistant. Ask me about classes, rooms, holidays, exams, syllabus or notices in English, हिंदी or Hinglish.`, ts: Date.now() }];
  if (!admin) { await loadVoiceConfig(); startPolling(); }
  shell();
}

window.addEventListener('logged-in', boot);
window.addEventListener('session-expired', () => logout(false));
setInterval(tick, 1000);
setInterval(() => { if (S.me && S.view === 'chat') today().catch(() => {}); }, 60000);

fetch(API_BASE + '/api/meta').then(r => r.json()).then(j => { S.secs = j.sections; }).catch(() => {}).finally(() => (S.token ? boot() : authView()));

</script>
